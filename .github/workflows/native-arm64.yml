name: Native ARM64 verification
on:
  push:
    branches: [ci/native-arm64-optimization-20261011]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: pin
            sha: 7af328a3143250e33399543ebf2192d9ca6a02c7
          - mode: current
            sha: ce6204e17e03e1219b98df8c16970ee5a441d70f
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: darnstrom/daqp
          ref: ${{ matrix.sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Isolated caches
        shell: pwsh
        run: |
          foreach ($name in @('PIP_CACHE_DIR','UV_CACHE_DIR','UV_PYTHON_INSTALL_DIR','UV_PYTHON_BIN_DIR','NUGET_PACKAGES','NUGET_HTTP_CACHE_PATH','NUGET_PLUGINS_CACHE_PATH','VIRTUALENV_OVERRIDE_APP_DATA')) {
            "$name=$env:RUNNER_TEMP/optimization-cache/$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build installed wheel and run numerical and upstream tests
        run: python harness/run_native.py daqp ${{ matrix.mode }} ${{ matrix.sha }}
      - name: Upload wheels and complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-daqp-${{ matrix.mode }}
          path: ${{ github.workspace }}/evidence/
          if-no-files-found: error
